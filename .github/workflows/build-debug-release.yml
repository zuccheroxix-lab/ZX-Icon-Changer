name: Build Debug & Release APK and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'debug-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Compile APKs & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        id: setup_jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        id: setup_sdk
        uses: android-actions/setup-android@v3

      - name: Grant Executable Permission to gradlew
        id: chmod_gradlew
        run: chmod +x ./gradlew

      - name: Resolve Release Signing Keystore
        id: resolve_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Production keystore detected from GitHub Secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating build-compatible signing keystore for assembleRelease..."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=ZX Icon Changer, OU=Release, O=ZUCCHERO XANN, C=ID"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Compile Android Debug APK
        id: assemble_debug
        run: ./gradlew assembleDebug

      - name: Compile Android Release APK
        id: assemble_release
        run: ./gradlew assembleRelease

      - name: Locate, Validate, and Prepare APKs
        id: validate_apks
        run: |
          mkdir -p release_dist

          echo "Searching for generated APK files..."
          DEBUG_APK=$(find app/build/outputs -type f -name "*debug*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs -type f -name "*release*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::CRITICAL FAILURE: Debug APK file was NOT generated!"
            exit 1
          fi

          DEBUG_BYTES=$(stat -c%s "$DEBUG_APK")
          if [ "$DEBUG_BYTES" -le 0 ]; then
            echo "::error::CRITICAL FAILURE: Debug APK file has 0 bytes!"
            exit 1
          fi

          cp "$DEBUG_APK" release_dist/ZX-Icon-Changer-debug.apk
          DEBUG_SHA256=$(sha256sum release_dist/ZX-Icon-Changer-debug.apk | awk '{print $1}')
          DEBUG_SIZE_HUMAN=$(ls -lh release_dist/ZX-Icon-Changer-debug.apk | awk '{print $5}')

          echo "DEBUG_APK_PATH=release_dist/ZX-Icon-Changer-debug.apk" >> $GITHUB_ENV
          echo "DEBUG_SHA256=$DEBUG_SHA256" >> $GITHUB_ENV
          echo "DEBUG_SIZE_HUMAN=$DEBUG_SIZE_HUMAN" >> $GITHUB_ENV
          echo "DEBUG_BYTES=$DEBUG_BYTES" >> $GITHUB_ENV

          echo "Debug APK: release_dist/ZX-Icon-Changer-debug.apk ($DEBUG_SIZE_HUMAN) - SHA-256: $DEBUG_SHA256"

          HAS_RELEASE_APK="false"
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            RELEASE_BYTES=$(stat -c%s "$RELEASE_APK")
            if [ "$RELEASE_BYTES" -gt 0 ]; then
              cp "$RELEASE_APK" release_dist/ZX-Icon-Changer-release.apk
              RELEASE_SHA256=$(sha256sum release_dist/ZX-Icon-Changer-release.apk | awk '{print $1}')
              RELEASE_SIZE_HUMAN=$(ls -lh release_dist/ZX-Icon-Changer-release.apk | awk '{print $5}')
              HAS_RELEASE_APK="true"

              echo "RELEASE_APK_PATH=release_dist/ZX-Icon-Changer-release.apk" >> $GITHUB_ENV
              echo "RELEASE_SHA256=$RELEASE_SHA256" >> $GITHUB_ENV
              echo "RELEASE_SIZE_HUMAN=$RELEASE_SIZE_HUMAN" >> $GITHUB_ENV
              echo "RELEASE_BYTES=$RELEASE_BYTES" >> $GITHUB_ENV
              echo "Release APK: release_dist/ZX-Icon-Changer-release.apk ($RELEASE_SIZE_HUMAN) - SHA-256: $RELEASE_SHA256"
            fi
          fi
          echo "HAS_RELEASE_APK=$HAS_RELEASE_APK" >> $GITHUB_ENV

          # Tag and Release title resolution
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_TITLE="ZX Icon Changer ${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.0.0-build${{ github.run_number }}"
            RELEASE_TITLE="ZX Icon Changer v1.0.0 (Build #${{ github.run_number }})"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Upload Artifacts to GitHub Actions
        id: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZX-Icon-Changer-APKs
          path: release_dist/*.apk
          retention-days: 30

      - name: Create GitHub Release and Upload APK Assets
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          # ${{ env.RELEASE_TITLE }}
          **Engineering & Branding:** ZUCCHERO XANN (ZX)

          Build APK resmi yang dikompilasi secara otomatis melalui Android Gradle di GitHub Actions.

          ---

          ### 📦 File Download APK (Assets):

          #### 1. Debug APK:
          - **File:** `ZX-Icon-Changer-debug.apk`
          - **Ukuran File:** ${{ env.DEBUG_SIZE_HUMAN }} (${{ env.DEBUG_BYTES }} bytes)
          - **SHA-256:**
            ```text
            ${{ env.DEBUG_SHA256 }}
            ```

          EOF

          if [ "${{ env.HAS_RELEASE_APK }}" == "true" ]; then
            cat << 'EOF' >> release_notes.md
          #### 2. Release APK (Optimized):
          - **File:** `ZX-Icon-Changer-release.apk`
          - **Ukuran File:** ${{ env.RELEASE_SIZE_HUMAN }} (${{ env.RELEASE_BYTES }} bytes)
          - **SHA-256:**
            ```text
            ${{ env.RELEASE_SHA256 }}
            ```

          EOF
          fi

          cat << 'EOF' >> release_notes.md
          ---

          ### 📱 Kompatibilitas Sistem:
          - **Package Name:** `com.aistudio.zxiconchanger.app`
          - **Minimum Android:** Android 7.0 (API level 24, Nougat)
          - **Target Android:** Android 16 (API level 36)

          ---

          ### ℹ️ Petunjuk Instalasi:
          1. Unduh salah satu file APK di bagian Assets di bawah (Debug APK untuk instalasi langsung, Release APK untuk performa optimal).
          2. Buka file APK pada HP Android Anda.
          3. Berikan izin pemasangan aplikasi dari sumber tidak dikenal bila diminta.
          4. Buka aplikasi ZX Icon Changer dan nikmati kustomisasi launcher icon Anda.
          EOF

          # Create release and upload all APK files in release_dist
          gh release create "${{ env.TAG_NAME }}" release_dist/*.apk \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes-file release_notes.md

      - name: Verify Release & Asset Existence
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying created release and uploaded assets..."
          RELEASE_DATA=$(gh release view "${{ env.TAG_NAME }}" --json url,assets)
          RELEASE_URL=$(echo "$RELEASE_DATA" | jq -r '.url // empty')
          ASSET_COUNT=$(echo "$RELEASE_DATA" | jq '.assets | length')

          if [ -z "$RELEASE_URL" ]; then
            echo "::error::CRITICAL: GitHub Release was not created or cannot be resolved!"
            exit 1
          fi

          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "::error::CRITICAL: No APK assets found attached to GitHub Release!"
            exit 1
          fi

          DEBUG_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/ZX-Icon-Changer-debug.apk"
          echo "DEBUG_DOWNLOAD_URL=$DEBUG_DOWNLOAD_URL" >> $GITHUB_ENV
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV

          if [ "${{ env.HAS_RELEASE_APK }}" == "true" ]; then
            RELEASE_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/ZX-Icon-Changer-release.apk"
            echo "RELEASE_DOWNLOAD_URL=$RELEASE_DOWNLOAD_URL" >> $GITHUB_ENV
          fi

          echo "=============================================="
          echo "RELEASE ASSETS VERIFIED SUCCESSFULLY"
          echo "Release URL: $RELEASE_URL"
          echo "Total Assets: $ASSET_COUNT"
          echo "Debug APK URL: $DEBUG_DOWNLOAD_URL"
          echo "=============================================="

      - name: Generate Workflow Summary (Success)
        if: success()
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## BUILD STATUS: SUCCESS

          - **Debug APK:** \`ZX-Icon-Changer-debug.apk\` (${{ env.DEBUG_SIZE_HUMAN }})
          - **Debug SHA-256:** \`${{ env.DEBUG_SHA256 }}\`
          - **Debug Download:** [Download Debug APK](${{ env.DEBUG_DOWNLOAD_URL }})
          EOF

          if [ "${{ env.HAS_RELEASE_APK }}" == "true" ]; then
            cat << EOF >> $GITHUB_STEP_SUMMARY
          - **Release APK:** \`ZX-Icon-Changer-release.apk\` (${{ env.RELEASE_SIZE_HUMAN }})
          - **Release SHA-256:** \`${{ env.RELEASE_SHA256 }}\`
          - **Release Download:** [Download Release APK](${{ env.RELEASE_DOWNLOAD_URL }})
          EOF
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY

          - **Release Page:** [${{ env.RELEASE_TITLE }}](${{ env.RELEASE_URL }})

          ### Direct Asset Links:
          \`\`\`text
          Debug APK:   ${{ env.DEBUG_DOWNLOAD_URL }}
          Release APK: ${{ env.RELEASE_DOWNLOAD_URL }}
          Release Page: ${{ env.RELEASE_URL }}
          \`\`\`
          EOF

      - name: Failure Diagnostic Summary
        if: failure()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## BUILD FAILED

          **Status:** Workflow mengalami kegagalan pada proses build atau verifikasi release.
          
          **Langkah Diagnostik:**
          1. Periksa log detail pada langkah yang berwarna merah di atas.
          2. Pastikan file APK berhasil dibuat oleh task \`./gradlew assembleDebug\`.
          3. Pastikan izin \`GITHUB_TOKEN\` memiliki akses \`contents: write\`.
          EOF
