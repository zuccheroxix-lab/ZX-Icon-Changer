name: Build Debug APK

on:
  push:
    branches:
      - main
    tags:
      - 'debug-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat GitHub Release untuk Debug APK ini?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-debug:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x ./gradlew

      - name: Run Unit & JVM Tests
        run: ./gradlew test

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Verify and Package Debug APK
        id: verify_apk
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::CRITICAL FAILURE: Debug APK file was NOT generated at $APK_SOURCE"
            exit 1
          fi

          mkdir -p dist

          # Extract version string
          if [[ "${{ github.ref }}" == refs/tags/debug-v* ]]; then
            VERSION="${GITHUB_REF_NAME#debug-v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION="1.0.0"
            TAG_NAME="debug-v1.0.0"
          fi

          # 1. Standard artifact name
          DEST_STANDARD="dist/ZX-Icon-Changer-debug.apk"
          # 2. Versioned release name
          DEST_VERSIONED="dist/ZX-Icon-Changer-debug-v${VERSION}.apk"

          cp "$APK_SOURCE" "$DEST_STANDARD"
          cp "$APK_SOURCE" "$DEST_VERSIONED"

          SHA256_HASH=$(sha256sum "$DEST_STANDARD" | awk '{print $1}')
          FILE_SIZE=$(ls -lh "$DEST_STANDARD" | awk '{print $5}')

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "SHA256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "DEBUG APK VERIFICATION SUCCESSFUL"
          echo "Standard APK:  $DEST_STANDARD"
          echo "Versioned APK: $DEST_VERSIONED"
          echo "File Size:     $FILE_SIZE"
          echo "SHA-256:       $SHA256_HASH"
          echo "=========================================="

      - name: Upload Debug APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZX-Icon-Changer-Debug-APK
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Debug Release (Optional / Tag Trigger)
        if: startsWith(github.ref, 'refs/tags/debug-v') || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify_apk.outputs.TAG_NAME }}
          name: ZX Icon Changer Debug ${{ steps.verify_apk.outputs.TAG_NAME }}
          body: |
            # ZX Icon Changer Debug ${{ steps.verify_apk.outputs.TAG_NAME }}
            **Branding & Engineering:** ZUCCHERO XANN (ZX)

            Build APK Debug resmi yang dihasilkan otomatis melalui kompilasi `./gradlew assembleDebug` di GitHub Actions.

            ---

            ### 📦 File Download APK Debug (Assets):
            - **Standard File:** `ZX-Icon-Changer-debug.apk`
            - **Versioned File:** `ZX-Icon-Changer-debug-v${{ steps.verify_apk.outputs.VERSION }}.apk`
            - **Ukuran File:** ${{ steps.verify_apk.outputs.FILE_SIZE }}
            - **SHA-256 Checksum:**
              ```text
              ${{ steps.verify_apk.outputs.SHA256 }}
              ```

            ---

            ### ⚡ Spesifikasi Build:
            - **Build Type:** Debug APK (Signed with standard Android Debug Keystore)
            - **Package Name:** `com.aistudio.zxiconchanger.app`
            - **Minimum Android:** Android 7.0 (API level 24, Nougat)
            - **Target Android:** Android 16 (API level 36)

            ---

            ### ℹ️ Cara Install APK Debug:
            1. Download file `ZX-Icon-Changer-debug.apk` di bawah pada HP Android Anda.
            2. Buka file APK melalui file manager / browser.
            3. Izinkan "Install from unknown sources" (Pasang dari sumber tidak dikenal) bila diminta.
            4. Buka aplikasi dan nikmati fitur ZX Icon Changer.
          files: dist/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
