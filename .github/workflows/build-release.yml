name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Resolve Release Signing Keystore
        id: resolve_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Production keystore detected from GitHub Secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret found in repository settings."
            echo "Generating build-compatible signing keystore for assembleRelease..."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=ZX Icon Changer, OU=Release, O=ZUCCHERO XANN, C=ID"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run CI Validation Tests
        run: ./gradlew test

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Compile Release APK
        run: ./gradlew assembleRelease

      - name: Automatically Locate & Package APKs
        id: locate_apks
        run: |
          mkdir -p dist_apks

          # Extract version from Git tag or fallback to version in build.gradle
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_TAG="v1.0.0"
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RAW_TAG=$RAW_TAG" >> $GITHUB_OUTPUT

          echo "Searching for generated APK files..."
          FOUND_RELEASE_APK=""
          FOUND_DEBUG_APK=""

          while IFS= read -r apk_file; do
            echo "Found APK: $apk_file ($(ls -lh "$apk_file" | awk '{print $5}'))"
            if [[ "$apk_file" == *"release"* ]]; then
              FOUND_RELEASE_APK="$apk_file"
            elif [[ "$apk_file" == *"debug"* ]]; then
              FOUND_DEBUG_APK="$apk_file"
            fi
          done < <(find app/build/outputs/apk/ -type f -name "*.apk")

          if [ -z "$FOUND_RELEASE_APK" ] && [ -z "$FOUND_DEBUG_APK" ]; then
            echo "ERROR: No generated APK files found in app/build/outputs/apk/!"
            exit 1
          fi

          if [ -n "$FOUND_RELEASE_APK" ]; then
            TARGET_RELEASE="dist_apks/ZX-Icon-Changer-v${VERSION}.apk"
            cp "$FOUND_RELEASE_APK" "$TARGET_RELEASE"
            SHA256_RELEASE=$(sha256sum "$TARGET_RELEASE" | awk '{print $1}')
            SIZE_RELEASE=$(ls -lh "$TARGET_RELEASE" | awk '{print $5}')
            echo "RELEASE_APK_PATH=$TARGET_RELEASE" >> $GITHUB_OUTPUT
            echo "RELEASE_SHA256=$SHA256_RELEASE" >> $GITHUB_OUTPUT
            echo "RELEASE_SIZE=$SIZE_RELEASE" >> $GITHUB_OUTPUT
            echo "Release APK created: $TARGET_RELEASE ($SIZE_RELEASE) - SHA-256: $SHA256_RELEASE"
          fi

          if [ -n "$FOUND_DEBUG_APK" ]; then
            TARGET_DEBUG="dist_apks/ZX-Icon-Changer-v${VERSION}-debug.apk"
            cp "$FOUND_DEBUG_APK" "$TARGET_DEBUG"
            SHA256_DEBUG=$(sha256sum "$TARGET_DEBUG" | awk '{print $1}')
            SIZE_DEBUG=$(ls -lh "$TARGET_DEBUG" | awk '{print $5}')
            echo "DEBUG_APK_PATH=$TARGET_DEBUG" >> $GITHUB_OUTPUT
            echo "DEBUG_SHA256=$SHA256_DEBUG" >> $GITHUB_OUTPUT
            echo "DEBUG_SIZE=$SIZE_DEBUG" >> $GITHUB_OUTPUT
            echo "Debug APK created: $TARGET_DEBUG ($SIZE_DEBUG) - SHA-256: $SHA256_DEBUG"
          fi

      - name: Upload APKs as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZX-Icon-Changer-APK
          path: dist_apks/*.apk
          retention-days: 30

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.locate_apks.outputs.RAW_TAG }}
          name: ZX Icon Changer ${{ steps.locate_apks.outputs.RAW_TAG }}
          body: |
            # ZX Icon Changer ${{ steps.locate_apks.outputs.RAW_TAG }}
            **Pengembang & Branding:** ZUCCHERO XANN (ZX)

            Aplikasi pengubah icon alternatif dan pembuat shortcut launcher modern untuk Android tanpa root, tanpa modifikasi APK asli, dan 100% diproses secara lokal/offline.

            ---

            ### 📦 File Rilis Resmi (Download):
            - **Nama File:** `ZX-Icon-Changer-${{ steps.locate_apks.outputs.RAW_TAG }}.apk`
            - **Ukuran:** ${{ steps.locate_apks.outputs.RELEASE_SIZE }}
            - **SHA-256 Checksum:**
              ```text
              ${{ steps.locate_apks.outputs.RELEASE_SHA256 }}
              ```

            ---

            ### ⚡ Fitur Utama:
            - **Icon Studio Editor**: Crop, scale (zoom 0.4x - 2.5x), rotasi derajat, pan offset (X/Y), padding, dan bentuk masking (Squircle, Circle, Square, Cyber Hexagon, Octagon).
            - **Sumber Gambar**: Icon aplikasi bawaan, Galeri foto via Android Photo Picker (`PickVisualMedia`), File lokal, dan Preset glyph futuristik ZX.
            - **Shortcut Launcher Asli**: Menggunakan `ShortcutManager` dan `ShortcutInfo` Android resmi.
            - **Label Kustom**: Bebas mengganti nama shortcut tanpa mengubah nama aplikasi asli.
            - **Multiple Shortcuts**: Mendukung banyak shortcut untuk satu aplikasi target.
            - **Room Database**: Manajemen daftar shortcut yang dibuat dengan fitur uji peluncuran dan sematkan ulang (*re-pin*).
            - **Backup & Restore Lokal**: Ekspor/impor konfigurasi ke format JSON portabel via Storage Access Framework.
            - **Update Checker**: Terintegrasi langsung dengan GitHub Releases API resmi.

            ---

            ### 📱 Kompatibilitas Sistem:
            - **Minimum Android:** Android 7.0 (API level 24, Nougat)
            - **Target Android:** Android 16 (API level 36)
          files: dist_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
