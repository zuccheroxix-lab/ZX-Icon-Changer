name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION="1.0.0"
            TAG_NAME="v1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Release keystore detected from GitHub Secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom release keystore secret found. Generating temporary fallback keystore for release assembly..."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=ZX Icon Changer, OU=Engineering, O=ZUCCHERO XANN, C=ID"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Unit & JVM Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Verify APKs & Generate Checksums
        id: verify_apks
        run: |
          mkdir -p output_apks
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          DEBUG_SRC="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_SRC="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$DEBUG_SRC" ]; then
            echo "Error: Debug APK not found at $DEBUG_SRC"
            exit 1
          fi

          if [ ! -f "$RELEASE_SRC" ]; then
            echo "Error: Release APK not found at $RELEASE_SRC"
            exit 1
          fi

          DEBUG_DEST="output_apks/ZX-Icon-Changer-v${VERSION}-debug.apk"
          RELEASE_DEST="output_apks/ZX-Icon-Changer-v${VERSION}-release.apk"

          cp "$DEBUG_SRC" "$DEBUG_DEST"
          cp "$RELEASE_SRC" "$RELEASE_DEST"

          SHA_DEBUG=$(sha256sum "$DEBUG_DEST" | awk '{print $1}')
          SHA_RELEASE=$(sha256sum "$RELEASE_DEST" | awk '{print $1}')
          SIZE_RELEASE=$(ls -lh "$RELEASE_DEST" | awk '{print $5}')
          SIZE_DEBUG=$(ls -lh "$DEBUG_DEST" | awk '{print $5}')

          echo "DEBUG_SHA=$SHA_DEBUG" >> $GITHUB_OUTPUT
          echo "RELEASE_SHA=$SHA_RELEASE" >> $GITHUB_OUTPUT
          echo "RELEASE_SIZE=$SIZE_RELEASE" >> $GITHUB_OUTPUT

          echo "=== APK VERIFICATION SUMMARY ==="
          echo "Release APK: $RELEASE_DEST ($SIZE_RELEASE)"
          echo "Release SHA-256: $SHA_RELEASE"
          echo "Debug APK:   $DEBUG_DEST ($SIZE_DEBUG)"
          echo "Debug SHA-256:   $SHA_DEBUG"

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zx-icon-changer-apks
          path: output_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: ZX Icon Changer ${{ steps.get_version.outputs.TAG_NAME }}
          body: |
            ## ZX Icon Changer ${{ steps.get_version.outputs.TAG_NAME }}
            **Branding:** ZUCCHERO XANN (ZX)

            Aplikasi pengubah icon alternatif dan pembuat shortcut launcher modern untuk Android tanpa root, tanpa modifikasi APK asli, dan 100% pemrosesan lokal/offline.

            ### Fitur Utama:
            - **Custom Icon Editor**: Skala (zoom), rotasi, pergeseran posisi (X/Y), padding, dan masking bentuk (Rounded Squircle, Circle, Square, Cyber Hexagon, Octagon).
            - **Sumber Gambar Lengkap**: Icon bawaan aplikasi, Galeri via Android Photo Picker, File lokal, dan Preset futuristik ZX.
            - **Custom Shortcut Labels**: Berikan nama shortcut yang berbeda dari aplikasi asli (contoh: *Chrome* -> *ZX Browser*).
            - **Multiple Shortcuts**: Buat beberapa shortcut dengan icon dan label berbeda untuk satu aplikasi target.
            - **Penyimpanan Lokal & Manajemen**: Didukung Room Database untuk menguji buka, sematkan ulang (re-pin), atau menghapus shortcut dengan aman.
            - **Backup & Restore Lokal**: Ekspor dan impor konfigurasi ke file JSON portabel via Android Storage Access Framework.
            - **Tema ZX Cyber**: Dark Mode futuristik, Light Mode, dan System Theme.
            - **Update Checker Resmi**: Terintegrasi langsung dengan GitHub Releases API.

            ### Spesifikasi APK:
            - **File:** `ZX-Icon-Changer-${{ steps.get_version.outputs.TAG_NAME }}-release.apk`
            - **Ukuran:** ${{ steps.verify_apks.outputs.RELEASE_SIZE }}
            - **Minimum Android:** Android 7.0 (Nougat, API 24)
            - **Target Android:** Android 16 (API 36)
            - **SHA-256 Checksum (Release):**
              ```text
              ${{ steps.verify_apks.outputs.RELEASE_SHA }}
              ```
            - **SHA-256 Checksum (Debug):**
              ```text
              ${{ steps.verify_apks.outputs.DEBUG_SHA }}
              ```

            ### Catatan Keamanan:
            Icon alternatif dibuat sebagai shortcut launcher entry resmi menggunakan `ShortcutManager` dan `ShortcutInfo`. APK asli tidak dimodifikasi dan sandbox Android tetap terjaga.
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
